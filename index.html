<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRIGram</title>
<meta name="description" content="A free weekly picture puzzle made from research figures of the Cancer Research Institute Ghent. Fill the grid cell by cell and discover the science behind it.">
<!-- link previews (LinkedIn, Teams, WhatsApp, …); without these LinkedIn picked a random text from the page as title; image made by maker/make-share-image.py -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="CRIGram">
<meta property="og:title" content="CRIGram: cell by cell, decoding our science">
<meta property="og:description" content="A free weekly picture puzzle made from research figures of the Cancer Research Institute Ghent. Fill the grid cell by cell and discover the science behind it.">
<meta property="og:image" content="https://jvdesomp.github.io/crigram/share-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="CRIGram logo: a C drawn in coloured grid cells">
<meta name="twitter:card" content="summary_large_image">
<!-- forwards to the game and keeps a puzzle link (?p=…) and campaign tags (?utm_campaign=…); after the forward the
     browser names this page as the referrer, so the real one (LinkedIn, Teams, …) is passed on for the visitor count -->
<script>
try { sessionStorage.setItem("crigram.ref", document.referrer); } catch (e) { /* ignore */ }
location.replace("crigram.html" + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=crigram.html"></noscript>
</head>
<body>
<p><a href="crigram.html">Open CRIGram</a></p>
</body>
</html>
